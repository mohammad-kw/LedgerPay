<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LedgerPay - a payment wallet built on double-entry ledgers, idempotent transfers, and reconciliation."
    />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Inter font (loaded via <link> rather than a CSS @import so it does
         not block the first paint). preconnect warms up the connection to
         Google's font servers before the stylesheet request is made. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>LedgerPay - Wallet & Reconciliation</title>
  </head>
  <body>
    <!-- React mounts the entire app inside this single div. -->
    <div id="root"></div>

    <!-- Razorpay Checkout. This MUST be loaded from Razorpay's own CDN (not
         bundled/self-hosted) - Razorpay requires their live script so it can
         be patched for security/compliance, and self-hosting it is against
         their integration terms. It exposes a global `window.Razorpay`
         constructor that Dashboard.jsx uses to open the payment popup after
         the backend creates an order. Loading it here (once, globally) means
         it's ready before any component needs it. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
