# ============================================================================
# LedgerPay backend - TEST configuration
# ============================================================================
# Spring Boot automatically prefers THIS file over the main
# src/main/resources/application.properties whenever tests run (e.g.
# `mvn test`, or any class annotated @SpringBootTest). This is standard
# Maven/Spring Boot convention based purely on the file's location under
# src/test/resources - no extra wiring needed.
#
# Why a completely separate config for tests? Per PROJECT_SPEC.md
# Section 8: "Use an in-memory or test database (H2 or Testcontainers) for
# integration tests — never test against the real dev database." Pointing
# tests at H2 instead of MySQL means:
#   1. `mvn test` works instantly on any machine (including CI - Section 9),
#      with zero setup - no real MySQL server needs to be installed/running.
#   2. It is architecturally impossible for a test to ever read/write our
#      real development or production data.
#   3. Each test run starts from a guaranteed-empty database (see
#      create-drop below), so tests can never interfere with each other by
#      leaking leftover rows between runs.
# ============================================================================

# jdbc:h2:mem:... starts a brand new in-memory database that lives only
# for the lifetime of the JVM process running the tests, then disappears
# completely - nothing is ever written to disk.
#   DB_CLOSE_DELAY=-1  -> keep the DB alive for as long as the JVM is up
#                         (instead of vanishing the instant the first
#                         connection closes, which would break tests that
#                         open multiple connections)
#   MODE=MySQL         -> tells H2 to emulate some MySQL-specific SQL
#                         syntax/behaviour, keeping test behaviour closer
#                         to what will really happen against MySQL in dev.
spring.datasource.url=jdbc:h2:mem:ledgerpay-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: build the entire schema fresh from our @Entity classes
# when the test's Spring context starts, and drop everything when it
# shuts down. This guarantees every test run starts from a clean slate
# that exactly matches our current entity definitions.
spring.jpa.hibernate.ddl-auto=create-drop

# Keep SQL logging on in tests too - handy for debugging a failing test
# by seeing exactly what Hibernate sent to the database.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================
# JWT settings for tests
# ============================================================================
# JwtService needs a signing key no matter what - even in tests - because
# any @SpringBootTest that loads the full application context will try to
# construct the JwtService bean. This is a fixed, throwaway secret used
# ONLY when running `mvn test`. It is completely separate from the real
# dev/prod secret in src/main/resources/application.properties, and since
# it only ever signs tokens inside a short-lived in-memory H2 test run,
# there is no security risk in it being visible here.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1uZXZlci11c2UtaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudA==
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# ============================================================================
# Razorpay settings for tests
# ============================================================================
# Fixed, throwaway values used ONLY under `mvn test`. The webhook secret in
# particular is read by WebhookSignatureVerifier; our integration tests sign
# their simulated webhook payloads with this SAME value (they autowire
# RazorpayProperties), so signature verification passes deterministically
# without any real Razorpay involvement. None of these are real credentials.
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=dummy_key_secret
razorpay.webhook-secret=test_webhook_secret_for_hmac

