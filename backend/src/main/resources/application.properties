# ============================================================================
# LedgerPay backend - main configuration
# ============================================================================
# Spring Boot reads this file at startup and uses it to configure beans
# like the DataSource (DB connection pool) and Hibernate automatically -
# we never write that wiring code ourselves.
#
# Every property below follows the pattern:  ${ENV_VAR_NAME:defaultValue}
# Spring first looks for ENV_VAR_NAME as an OS environment variable, and
# only falls back to defaultValue if that variable isn't set. This is
# exactly what PROJECT_SPEC.md Section 7 requires: "All secrets... in
# environment variables — never committed to Git." Nothing sensitive is
# hard-coded in this file - only safe, local-dev-only fallback defaults.
#
# HOW TO SET REAL VALUES ON YOUR OWN MACHINE (pick one):
#   1. Set them in your PowerShell session before running the app:
#        $env:DB_PASSWORD = "your-real-password"
#   2. Or create a `.env` file in backend/ (already covered by
#      .gitignore) and load it via your IDE's run configuration.
#   3. Or pass as a program argument:
#        mvn spring-boot:run -Dspring-boot.run.arguments=--DB_PASSWORD=your-real-password
# Never type a real password or secret directly into this file.
# ============================================================================

# ---- Application identity -------------------------------------------------
spring.application.name=ledgerpay-backend
# ---- Server ----------------------------------------------------------------
# Port the embedded Tomcat server listens on. Overridable via the PORT env
# var because that's what free hosting platforms like Render (Section 2)
# automatically inject at deploy time - our code doesn't need to change
# between local dev and production for this.
server.port=${PORT:8080}

# ---- Logging (structured, with correlation id) -----------------------------
# Add the per-request correlation id (set by CorrelationIdFilter into the
# SLF4J MDC under key "requestId") to every console log line via %X{requestId}.
# The pattern mirrors Spring Boot's default but injects "[%X{requestId}]" right
# before the logger name, so a single request's whole journey - across
# controller, service and repository logs - can be grep'd by one id. Lines
# logged outside any request (e.g. startup) simply show an empty id.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %-8.8X{requestId} --- [%15.15t] %-40.40logger{39} : %m%n

# ---- Database connection (MySQL) -------------------------------------------
# JDBC URL breakdown: protocol + host + port + database name + options.
#   useSSL=false                 -> fine for local dev; a real deployed DB should use SSL
#   allowPublicKeyRetrieval=true -> required by some MySQL 8 auth plugins when useSSL=false
#   serverTimezone=UTC           -> avoids MySQL driver timezone-conversion surprises
# The placeholder default below assumes a local MySQL server with a
# database named `ledgerpay` that you create yourself first, e.g.:
#   CREATE DATABASE ledgerpay;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledgerpay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Spring Boot can normally auto-detect the driver class from the URL
# above, but naming it explicitly documents intent and removes any doubt.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ---------------------------------------------------------
# ddl-auto=update makes Hibernate compare our @Entity classes against the
# current database schema at every startup and auto-add anything missing
# (new tables/columns). Convenient while entities are still evolving in
# early development, but a KNOWN, DELIBERATE trade-off worth explaining in
# an interview: "update" can never safely rename or drop a column, and is
# not something you'd trust on a real production database with teammates -
# a proper migration tool (e.g. Flyway/Liquibase) would replace this
# later. For a solo portfolio project at this stage, it is an acceptable
# shortcut.
spring.jpa.hibernate.ddl-auto=update

# Log every SQL statement Hibernate executes to the console, nicely
# indented. Extremely useful while learning ("what SQL did my @Entity
# annotations actually produce?"); would typically be turned off in a real
# production deployment to reduce log noise.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly pick the SQL dialect Hibernate generates. Spring Boot can
# usually infer this from the JDBC URL, but being explicit documents
# intent, and makes the Section 2 fallback ("MySQL if available, otherwise
# PostgreSQL for the deployed demo") a one-line change later
# (org.hibernate.dialect.PostgreSQLDialect) instead of guesswork.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- JWT (JSON Web Token) settings -----------------------------------------
# Read by com.wallet.security.JwtProperties (a type-safe @ConfigurationProperties
# class) and used by com.wallet.security.JwtService to sign/verify access
# tokens (PROJECT_SPEC.md Section 2 and Section 7).
#
# jwt.secret: the key used to sign every access token's HMAC-SHA256
# signature - anyone holding this value could forge valid tokens for any
# user, so in a REAL deployment this must come from the JWT_SECRET
# environment variable, never from this file. The long random string
# after the ":" below is a LOCAL-DEV-ONLY fallback (generated once, safe
# to commit only because this project has never used it for anything
# real) so that the app can start immediately on a fresh checkout without
# forcing you to set an environment variable first. HMAC-SHA256 requires
# a secret of at least 32 bytes - this fallback is 64 bytes.
jwt.secret=${JWT_SECRET:qM3ZkBwO9aBZ1JI+HzOj+k++B8NuruvBBkElgx72sjTs01p94snuu/AwhjZucb54W+oBy+QNRxuYEsjPdfYZkw==}

# 15 minutes, in milliseconds - matches PROJECT_SPEC.md Section 2 & 7's
# "short-lived (e.g. 15 min)" access token guidance exactly.
jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}

# 7 days, in milliseconds - a "longer-lived" refresh token per Section 2.
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ---- Razorpay (Test Mode) --------------------------------------------------
# Read by com.wallet.config.RazorpayProperties and used by
# com.wallet.service.RazorpayOrderService to create payment Orders
# (PROJECT_SPEC.md Section 2 & 6). These are TEST-MODE keys only - no real
# money ever moves - but they are still secrets and so follow the same
# ${ENV_VAR:default} pattern as everything else: in any real deployment set
# RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET as environment variables (Section 7),
# never commit real keys here.
#
# The "rzp_test_xxx" placeholder defaults let the application START without
# any env vars set (so a fresh checkout boots), but they are NOT valid
# credentials - actually calling Razorpay with them will fail until you
# drop in your own test keys from the Razorpay dashboard. Grab them from:
#   Razorpay Dashboard -> Settings -> API Keys -> Generate Test Key
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxxxx}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:changeme_test_secret}

# The webhook signing secret (Phase 3). This is a SEPARATE secret from the
# key id/secret above - you choose it yourself when creating a webhook in the
# Razorpay Dashboard (Settings -> Webhooks), and Razorpay uses it to HMAC-sign
# every webhook it sends us. WebhookService uses it to verify the
# X-Razorpay-Signature header on incoming calls (Section 3.4 & 6). The
# placeholder default lets the app boot without env vars set, but signature
# verification will reject every real webhook until you set the true value
# via the RAZORPAY_WEBHOOK_SECRET environment variable.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:changeme_webhook_secret}

# ---- DEV-ONLY: mock top-up (Razorpay bypass) -------------------------------
# A development/demo switch that enables POST /api/wallet/topup/mock, which
# instantly credits a wallet WITHOUT calling Razorpay - useful while the
# Razorpay account's KYC/activation is still pending, so the rest of the app
# (transfers, ledger, balances) can be demoed end-to-end.
#
# It reuses the SAME double-entry ledger + state-machine logic as the real
# webhook path (see MockTopUpService), so it's a faithful simulation, not a
# shortcut. BUT it lets a caller mint money on demand, so it MUST stay off in
# any real deployment. Guarded two ways: MockTopUpService/MockTopUpController
# are @ConditionalOnProperty on this flag (the route 404s when false), and the
# frontend only shows the button in dev builds.
#
# Default is false (safe). Turn it on locally by setting MOCK_TOPUP_ENABLED=true
# (the run-backend.ps1 helper loads it from backend/.env).
app.mock-topup.enabled=${MOCK_TOPUP_ENABLED:false}

# ---- Reconciliation job (Section 3.5) --------------------------------------
# Which gateway source the reconciliation ENGINE compares against. The engine
# (ReconciliationService) depends only on the PaymentGatewayReconciliationSource
# interface, so this one property picks the implementation with zero code
# changes:
#   simulated -> SimulatedGatewaySource (default). Derives a plausible gateway
#                view from our own local top-ups with deterministic drift, so
#                reconciliation - including all four mismatch types - can be
#                demoed WITHOUT an activated Razorpay account.
#   razorpay  -> RazorpayGatewaySource. Calls Razorpay's real Payments API;
#                requires activated, authenticating keys.
# Default is "simulated" so a fresh checkout can run the job immediately.
app.reconciliation.gateway-provider=${RECONCILIATION_GATEWAY_PROVIDER:simulated}

# Cron for the daily @Scheduled run (ReconciliationScheduler), in
# second minute hour dom month dow format. Default: 02:00 every day (IST).
# Reconciles the PREVIOUS day, which by then has fully settled.
app.reconciliation.cron=${RECONCILIATION_CRON:0 0 2 * * *}

# ---- Admin bootstrap account (RBAC) ----------------------------------------
# On startup, AdminSeeder creates ONE user with role=ADMIN from these values,
# if it doesn't already exist. There is deliberately no "register as admin"
# API - the first admin must come from trusted server config, never a public
# request body. Leave email/password blank (the default) and no admin is
# created. In a real deployment set ADMIN_EMAIL / ADMIN_PASSWORD as env vars
# (the run-backend.ps1 helper loads them from backend/.env).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}

